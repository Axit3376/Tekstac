<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appliance Power Control Simulation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Appliance Power Control</h1>
    <p class="intro">Turn appliances on or off. Invalid operations are handled without stopping the simulation.</p>

    <section id="applianceControls" class="controls" aria-label="Appliance controls"></section>

    <section class="activity" aria-labelledby="activityTitle">
      <div class="activity-header">
        <h2 id="activityTitle">Activity log</h2>
        <button id="clearLog" type="button">Clear log</button>
      </div>
      <output id="log" aria-live="polite">Ready to manage appliance power.</output>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
