<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="form-card">
    <h1>Registration Form</h1>
    <form id="registrationForm" novalidate>
      <div class="field">
        <label for="name">Name:</label>
        <input id="name" name="name" type="text" autocomplete="name">
        <span id="nameError" class="error" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="email">Email:</label>
        <input id="email" name="email" type="email" autocomplete="email">
        <span id="emailError" class="error" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="password">Password:</label>
        <input id="password" name="password" type="password" autocomplete="new-password">
        <span id="passwordError" class="error" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password:</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password">
        <span id="confirmPasswordError" class="error" aria-live="polite"></span>
      </div>

      <button type="submit">Submit</button>
      <p id="successMessage" class="success" aria-live="polite"></p>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
